  <text x="46" y="625" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#43545F">Missing means that growth, change or bleeding was unknown on at least one photo of the lesion.</text>
  <text x="46" y="651" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#43545F">Open points mark the small groups with one or three unknown symptoms (10 and 6 keys, respectively).</text>
  <text x="46" y="677" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#43545F">These proportions describe the recorded cases. They cannot establish why symptoms were missing.</text>
</svg>