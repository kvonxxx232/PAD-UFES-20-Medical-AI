<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" role="img" aria-labelledby="title description">
  <title id="title">Figure 5. Symptom missingness and case composition</title>
  <desc id="description">Descriptive S7 analysis of 1,865 curated lesion keys. Cancer-positive keys by number of unknown symptoms: 0 unknown, 475 of 1478, 1 unknown, 6 of 10, 2 unknown, 330 of 371, 3 unknown, 5 of 6. Biopsy-confirmed keys: Complete, 638 of 1478, Missing, 387 of 387.</desc>
  <rect x="0" y="0" width="1120" height="700" fill="white" />
  <text x="46" y="35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#125C69" letter-spacing="1.2">PAD-UFES-20 V1.1  ·  FIGURE 5</text>
  <text x="44" y="81" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="bold" fill="#182A37">Symptom missingness and case composition</text>
  <text x="46" y="111" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#43545F">Prespecified descriptive analysis (S7)  ·  1,865 curated lesion keys</text>
