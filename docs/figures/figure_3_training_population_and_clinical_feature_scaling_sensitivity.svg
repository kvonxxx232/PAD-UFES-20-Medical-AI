  <title id="title">Figure 3. Training population and clinical-feature scaling sensitivity</title>
  <desc id="desc">Pooled out-of-fold differences in log loss on the same 1,478 symptom-complete lesion keys. Negative values favour Model B. Panel A compares training populations. Panel B varies the clinical feature multiplier. Exact differences for the five outer folds appear below their pooled estimates.</desc>
  <rect x="0" y="0" width="1200" height="765" fill="white" />
  <text x="46" y="35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#125C69" letter-spacing="1.2">PAD-UFES-20 V1.1  ·  FIGURE 3</text>
  <text x="44" y="81" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="bold" fill="#182A37">Training population and clinical-feature scaling sensitivity</text>
  <text x="46" y="113" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#43545F">All settings use the same 1,478 symptom-complete outer-test lesion keys. Negative Δ log loss favours Model B.</text>
