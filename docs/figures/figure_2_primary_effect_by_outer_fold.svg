<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1240" viewBox="0 0 1000 620" role="img" aria-labelledby="title description">
  <title id="title">Figure 2. Primary effect by outer fold</title>
  <desc id="description">Lesion-level out-of-fold log loss differences for Model B minus Model A. Negative values favour Model B. Fold 1: −0.088830. Fold 2: −0.059935. Fold 3: −0.088560. Fold 4: −0.038966. Fold 5: −0.062885. Pooled difference: −0.067824; paired patient-bootstrap 95% confidence interval [−0.084488, −0.050819].</desc>
  <rect x="0" y="0" width="1000" height="620" fill="#FFFFFF" />
  <text x="42" y="35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#125C69" text-anchor="start" letter-spacing="1.2">PAD-UFES-20 V1.1  ·  FIGURE 2</text>
  <text x="40" y="81" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="bold" fill="#182A37" text-anchor="start">Primary effect by outer fold</text>
  <text x="42" y="111" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#43545F" text-anchor="start">1,478 symptom-complete lesion keys from 1,115 patients</text>
  <text x="42" y="159" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#182A37" text-anchor="start">Evaluation set</text>
